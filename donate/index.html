<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>赞助 Nebula 开发</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f6fa;
      --surface: rgba(255, 255, 255, .88);
      --surface-strong: #fff;
      --text: #20242d;
      --muted: #697386;
      --accent: #cbad8e;
      --border: rgba(31, 36, 48, .1);
      --shadow: 0 24px 70px rgba(29, 39, 58, .13);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #17191e;
        --surface: rgba(34, 37, 44, .92);
        --surface-strong: #252932;
        --text: #f5f7fb;
        --muted: #aeb6c5;
        --border: rgba(255, 255, 255, .1);
        --shadow: 0 24px 70px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(203, 173, 142, .2), transparent 36rem),
        radial-gradient(circle at 100% 12%, rgba(112, 153, 212, .18), transparent 34rem),
        var(--background);
      font: 16px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 48px;
    }

    .hero {
      margin-bottom: 30px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.15;
      letter-spacing: .02em;
    }

    .intro {
      max-width: 620px;
      margin: 16px auto 0;
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 16px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 23px;
    }

    .card-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--text);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }

    .qr-frame {
      margin: 0 18px 18px;
      padding: 12px;
      border-radius: 18px;
      background: #fff;
    }

    .qr-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .note {
      margin: 26px auto 0;
      max-width: 700px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--muted);
      background: var(--surface);
      text-align: center;
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      main { padding-top: 40px; }
      .cards { grid-template-columns: 1fr; }
      .card-header { padding: 18px 20px 14px; }
      .qr-frame { margin-inline: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">Nebula project</p>
      <h1>感谢支持 Nebula</h1>
      <p class="intro">Nebula 是一个开源的多游戏桌面工具。你的支持会帮助项目持续维护、改进功能并承担必要的开发成本。</p>
    </header>
